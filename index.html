<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>青岛地铁线路图 · 在线版</title>
<!-- 在线版：底图瓦片来自天地图在线服务（需联网）；不使用任何网络字体 CDN，字体全部取自本机系统字体（Windows 微软雅黑 / macOS 苹方，中文系统必装）。
     如需打包指定字体：将字体文件放入 fonts/，并把下方 @font-face 中的 url() 行取消注释即可。
     （Noto Sans SC 等 CJK 全字重字体体积约 5-16MB，默认不打包。） -->
<style>
  @font-face {
    font-family: "QDFont";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: "QDFont";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: "QDFont";
    src: local("Noto Sans SC"), local("Noto Sans CJK SC");
    font-weight: 900;
    font-display: swap;
  }
  :root {
    --bg: #eef1f5;
    --panel: #ffffff;
    --ink: #1d2733;
    --ink-2: #5b6775;
    --ink-3: #8b96a5;
    --line: #e3e8ee;
    --brand: #1a5fb4;
    --shadow: 0 8px 28px rgba(23, 35, 52, .12), 0 2px 8px rgba(23, 35, 52, .06);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "QDFont", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #app { position: fixed; inset: 0; }

  /* ============ map ============ */
  #map {
    position: absolute; inset: 0;
    background: #dbe3ec;
    cursor: grab;
    touch-action: none;
  }
  #map.dragging { cursor: grabbing; }
  #tiles { position: absolute; top: 0; left: 0; }
  #tiles .tile { position: absolute; width: 256px; height: 256px; }
  #tiles .tile img {
    position: absolute; top: 0; left: 0; width: 256px; height: 256px;
    -webkit-user-drag: none; user-select: none; pointer-events: none;
  }
  #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #overlay .station { pointer-events: auto; cursor: pointer; }
  #overlay .cmarker { pointer-events: auto; cursor: pointer; }
  #overlay .cmarker:hover { filter: brightness(1.15); }

  .map-attribution {
    position: absolute; left: 10px; bottom: 10px; z-index: 5;
    background: rgba(255,255,255,.82); backdrop-filter: blur(4px);
    color: var(--ink-3); font-size: 11px; line-height: 1.5;
    padding: 4px 8px; border-radius: 8px; max-width: min(460px, 62vw);
  }
  .map-attribution a { color: var(--ink-2); text-decoration: none; }

  /* offline banner */
  #offline-banner {
    position: absolute; top: 14px; left: 50%; z-index: 12;
    transform: translateX(-50%);
    background: #fff7e6; color: #8a5a00;
    border: 1px solid #f2d28a;
    font-size: 12px; line-height: 1.6;
    padding: 8px 14px; border-radius: 10px;
    box-shadow: var(--shadow);
    display: none; max-width: min(560px, 80vw); text-align: center;
  }
  #offline-banner.show { display: block; }
  #offline-banner b { font-weight: 700; }

  .map-ctrl {
    position: absolute; right: 14px; z-index: 6;
    display: flex; flex-direction: column; gap: 8px;
  }
  .map-ctrl .btn {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    font-size: 20px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform .12s ease, background .12s ease;
    user-select: none;
  }
  .map-ctrl .btn:hover { background: #f2f6fb; }
  .map-ctrl .btn:active { transform: scale(.94); }
  .map-ctrl .btn .svg { width: 20px; height: 20px; }

  #popup {
    position: absolute; z-index: 7; display: none;
    min-width: 150px; max-width: 260px;
    background: var(--panel); border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 10px 12px;
    transform: translate(-50%, -100%);
    pointer-events: none;
  }
  #popup::after {
    content: ""; position: absolute; left: 50%; bottom: -6px;
    width: 12px; height: 12px; background: var(--panel);
    transform: translateX(-50%) rotate(45deg);
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  #popup .p-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  #popup .p-meta { font-size: 12px; color: var(--ink-2); line-height: 1.6; }
  #popup .p-addr { color: var(--ink-2); }
  #popup .p-remark { color: #8a4a1e; background: #fdf3e7; border-radius: 8px; padding: 6px 8px; margin-top: 5px; line-height: 1.55; }
  #popup .p-xy { color: var(--ink-3); font-size: 11px; margin-top: 5px; }
  #popup .line-chip {
    display: inline-block; margin: 2px 4px 0 0; padding: 1px 8px;
    border-radius: 20px; color: #fff; font-size: 11px; font-weight: 700;
  }

  #popup .p-nav-row { margin-top: 8px; text-align: right; pointer-events: auto; }
  #popup .p-nav {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--brand); color: #fff; border: 0; border-radius: 8px;
    padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  #popup .p-nav:hover { opacity: .88; }
  #popup .p-nav svg { width: 13px; height: 13px; fill: currentColor; }

  /* ============ panel ============ */
  #panel {
    position: absolute; top: 14px; left: 14px; z-index: 8;
    width: 312px; max-height: calc(100vh - 28px);
    display: flex; flex-direction: column;
    background: var(--panel); border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--line);
    background:
      linear-gradient(135deg, rgba(26,95,180,.08), transparent 60%),
      var(--panel);
  }
  .panel-head .brand { display: flex; align-items: center; gap: 10px; }
  .panel-head .logo {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    background: linear-gradient(140deg, #1a5fb4, #2f8fe0);
    box-shadow: 0 4px 10px rgba(26,95,180,.28);
  }
  .panel-head h1 { font-size: 17px; font-weight: 900; letter-spacing: .5px; }
  .panel-head .sub { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  .panel-head .badge {
    display: inline-block; margin-top: 8px;
    font-size: 10px; font-weight: 700; color: #fff;
    background: linear-gradient(140deg, #2f8fe0, #1a5fb4);
    padding: 2px 8px; border-radius: 20px;
  }

  .search-wrap { position: relative; margin: 12px 18px 4px; }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: #f2f5f9; border: 1.5px solid transparent;
    border-radius: 12px; padding: 9px 12px;
    transition: border-color .15s ease, background .15s ease;
  }
  .search-box:focus-within { border-color: var(--brand); background: #fff; }
  .search-box .svg { width: 17px; height: 17px; flex: none; color: var(--ink-3); }
  .search-box input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 13.5px; font-family: inherit; color: var(--ink);
  }
  .search-box input::placeholder { color: var(--ink-3); }
  .search-clear { cursor: pointer; color: var(--ink-3); padding: 2px 4px; display: none; align-items: center; }
  .search-clear.show { display: flex; }

  .suggest {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: var(--panel); border-radius: 12px; box-shadow: var(--shadow);
    overflow: hidden; display: none; max-height: 340px; overflow-y: auto;
  }
  .suggest.show { display: block; }
  .suggest .s-group {
    font-size: 10.5px; color: var(--ink-3); letter-spacing: 1px;
    padding: 8px 14px 4px; font-weight: 700;
  }
  .suggest .s-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .suggest .s-item:hover, .suggest .s-item.active { background: #eef4fb; }
  .suggest .s-item .s-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .suggest .s-item .s-name b { font-weight: 700; }
  .suggest .s-item .s-tag {
    font-size: 10px; color: var(--ink-3); flex: none;
    max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .suggest .s-item .chip {
    flex: none; font-size: 10px; font-weight: 700; color: #fff;
    border-radius: 20px; padding: 1px 7px;
  }
  .suggest .s-item .tag-pill {
    flex: none; font-size: 10px; color: var(--ink-2);
    background: #eef1f5; border-radius: 20px; padding: 1px 8px;
  }
  .suggest .s-empty { padding: 14px; font-size: 12.5px; color: var(--ink-3); }

  .legend { padding: 10px 18px 14px; overflow-y: auto; }
  .legend-title {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--ink-2); font-weight: 700; margin: 6px 0 8px;
  }
  .legend-title .act { font-weight: 500; color: var(--brand); cursor: pointer; font-size: 11.5px; }
  .legend-title .act:hover { text-decoration: underline; }
  .legend .row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 10px; cursor: pointer;
    transition: background .12s ease;
  }
  .legend .row:hover { background: #f4f7fb; }
  .legend .row.off { opacity: .38; }
  .legend .line-dot {
    width: 11px; height: 11px; border-radius: 4px; flex: none;
    box-shadow: 0 0 0 1px rgba(0,0,0,.06);
  }
  .legend .row .ln { font-size: 13px; font-weight: 700; flex: none; min-width: 58px; }
  .legend .row .rt { flex: 1; font-size: 11px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend .row .cnt { flex: none; font-size: 10.5px; color: var(--ink-3); background: #eef1f5; border-radius: 20px; padding: 1px 8px; }
  .legend .row .eye { flex: none; color: var(--ink-3); }
  .legend .row .eye .svg { width: 15px; height: 15px; display: block; }

  .layer-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px; border-radius: 10px; cursor: pointer;
    transition: background .12s ease; margin-top: 2px;
  }
  .layer-row:hover { background: #f4f7fb; }
  .layer-row .sw {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, #ff9d8f, #e8452c);
    box-shadow: 0 0 0 1px rgba(0,0,0,.08);
    transition: filter .15s ease;
  }
  .layer-row.off .sw { filter: grayscale(1); opacity: .5; }
  .layer-row .lname { font-size: 13px; font-weight: 700; flex: none; }
  .layer-row .lcnt { flex: 1; font-size: 11px; color: var(--ink-3); text-align: right; }
  .pin-title { margin-top: 10px; }
  .act#btn-add-pin.active { color: #fff; background: var(--brand); border-radius: 8px; padding: 2px 8px; font-weight: 700; }
  .act#btn-add-pin { transition: background .15s ease, color .15s ease; }
  .cmarker { cursor: pointer; }
  #map.adding { cursor: crosshair; }

  .pin-modal {
    position: fixed; inset: 0; z-index: 120;
    display: none; align-items: center; justify-content: center;
    background: rgba(17, 24, 39, .45); backdrop-filter: blur(2px);
  }
  .pin-modal.show { display: flex; }
  .pin-modal-box {
    width: min(320px, 84vw); background: #fff; border-radius: 16px;
    padding: 18px 18px 14px; box-shadow: 0 18px 50px rgba(17, 24, 39, .25);
  }
  .pin-modal-box .pm-title { font-size: 15px; font-weight: 800; color: var(--ink); }
  .pin-modal-box .pm-tip { font-size: 11px; color: var(--ink-3); margin: 4px 0 12px; }
  .pin-modal-box input {
    width: 100%; box-sizing: border-box; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; font-size: 14px; margin-bottom: 10px; outline: none;
    font-family: inherit;
  }
  .pin-modal-box input:focus { border-color: var(--brand); }
  .pin-modal-box .pm-actions { display: flex; gap: 10px; margin-top: 4px; }
  .pin-modal-box .pm-btn {
    flex: 1; border: none; border-radius: 10px; padding: 10px 0; font-size: 14px;
    cursor: pointer; background: #eef1f5; color: var(--ink); font-family: inherit;
  }
  .pin-modal-box .pm-btn.pm-primary { background: var(--brand); color: #fff; font-weight: 700; }

  .p-del {
    margin-top: 8px; padding: 8px 0; text-align: center; font-size: 13px; font-weight: 700;
    color: #d33; border-top: 1px dashed var(--line); cursor: pointer;
  }
  .p-del:hover { text-decoration: underline; }
  .p-xy-note { font-size: 11px; color: var(--ink-3); margin-top: 4px; }



  .panel-foot {
    padding: 10px 18px 14px; border-top: 1px solid var(--line);
    font-size: 10.5px; color: var(--ink-3); line-height: 1.7;
    background: #fafbfd;
  }
  .panel-foot .stat { display: flex; gap: 14px; margin-bottom: 6px; }
  .panel-foot .stat b { font-size: 13px; color: var(--ink); font-weight: 700; }
  .panel-foot code {
    background: #eef1f5; border-radius: 5px; padding: 0 4px;
    font-family: Consolas, "Courier New", monospace; font-size: 10px;
  }

  #panel-toggle {
    position: absolute; top: 14px; left: 14px; z-index: 9;
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: none; align-items: center; justify-content: center; cursor: pointer;
  }
  #panel-toggle .svg { width: 20px; height: 20px; }

  #toast {
    position: absolute; left: 50%; bottom: 34px; z-index: 30;
    transform: translateX(-50%) translateY(8px);
    background: rgba(23,35,52,.9); color: #fff;
    font-size: 12.5px; padding: 8px 14px; border-radius: 10px;
    opacity: 0; transition: opacity .2s ease, transform .2s ease;
    pointer-events: none; max-width: 70vw;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #map-loading {
    position: absolute; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background: #dbe3ec; transition: opacity .4s ease; pointer-events: none;
  }
  #map-loading .spinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(26,95,180,.15); border-top-color: var(--brand);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 768px) {
    #panel {
      top: 0; left: 0; width: min(84vw, 320px);
      max-height: 100vh; height: 100%;
      border-radius: 0 16px 16px 0;
      transform: translateX(-105%);
      transition: transform .24s ease;
    }
    #panel.open { transform: translateX(0); }
    #panel-toggle { display: flex; }
    .map-ctrl { right: 12px; }
    #popup { max-width: 200px; }
    #offline-banner { top: 70px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="tiles"></div>
    <svg id="overlay"></svg>
    <div id="map-loading"><div class="spinner"></div></div>
    <div id="offline-banner"><b>在线底图加载失败。</b>请检查网络连接，或确认页面内的天地图密钥 <code>tk</code> 是否有效；地铁线路、搜索与自定义标注仍可正常使用。</div>
    <div class="map-ctrl">
      <button class="btn" id="btn-zoom-in" title="放大" aria-label="放大地图"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn" id="btn-zoom-out" title="缩小" aria-label="缩小地图"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <button class="btn" id="btn-locate" title="回到青岛" aria-label="回到青岛"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22M5.6 5.6l2.5 2.5M15.9 15.9l2.5 2.5M18.4 5.6l-2.5 2.5M8.1 15.9l-2.5 2.5"/></svg></button>
    </div>
    <div id="popup"></div>
    <div class="map-attribution">
      底图 © <span id="map-credit"></span> · 地铁与地点数据 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors (ODbL) · 在线版，底图需联网加载
    </div>
  </div>

  <button id="panel-toggle" aria-label="打开面板"><svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>

  <aside id="panel">
    <div class="panel-head">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3.5" width="16" height="17" rx="4"/>
            <circle cx="8.6" cy="9" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="15.4" cy="9" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="8.6" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="15.4" cy="15.5" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
        </div>
        <div>
          <h1>青岛地铁线路图</h1>
          <div class="sub">青岛轨道交通网络 · 交互地图</div>
          <span class="badge">在线版</span>
        </div>
      </div>
    </div>

    <div class="search-wrap">
      <div class="search-box">
        <svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input id="search-input" type="text" placeholder="搜索地铁站或地点，如：五四广场 / 栈桥" autocomplete="off" role="combobox" aria-expanded="false">
        <span class="search-clear" id="search-clear" title="清空"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
      </div>
      <div class="suggest" id="suggest"></div>
    </div>

    <div class="legend">
      <div class="legend-title">
        <span>线路选择</span>
        <span class="act" id="legend-all">全选 / 清空</span>
      </div>
      <div id="legend-list"></div>
      <div class="legend-title pin-title">
        <span>图钉图层</span>
        <span class="act" id="btn-add-pin">＋ 新建图钉</span>
      </div>
      <div id="pin-layers"></div>
    </div>

    <div class="panel-foot">
      <div class="stat">
        <span><b id="stat-lines">—</b> 条线路</span>
        <span><b id="stat-stations">—</b> 座车站</span>
        <span><b id="stat-pois">—</b> 个地点</span>
      </div>
      <div>在线运行：底图瓦片实时加载（默认高德地图，源码可一键切换天地图）；地铁线路、站点、地点与自定义标注数据全部内联在页面中，单文件即可部署。</div>
    </div>
  </aside>

  <div id="pin-modal" class="pin-modal">
    <div class="pin-modal-box">
      <div class="pm-title">新建图钉</div>
      <div class="pm-tip">图钉将放在「我的图钉」图层</div>
      <input id="pm-name" type="text" placeholder="名称（必填），如：老地方">
      <input id="pm-remark" type="text" placeholder="备注（可选）">
      <div class="pm-actions">
        <button class="pm-btn" id="pm-cancel" type="button">取消</button>
        <button class="pm-btn pm-primary" id="pm-ok" type="button">保存</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
</div>

/* ---------- 坐标系对齐：底图为高德(GCJ-02)，OSM 数据为 WGS-84，青岛偏移约430m；统一转 GCJ-02 ---------- */
function _gcjTransformLat(x, y) {
  let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
  return ret;
}
function _gcjTransformLng(x, y) {
  let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
  ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
  ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
  return ret;
}
function wgs84ToGcj02(lng, lat) {
  if (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271) return [lng, lat];
  const a = 6378245.0, ee = 0.00669342162296594323;
  const dLat = _gcjTransformLat(lng - 105.0, lat - 35.0);
  const dLng = _gcjTransformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * Math.PI;
  let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  const mDLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
  const mDLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
  return [lng + mDLng, lat + mDLat];
}
// 数据坐标从 WGS-84 对齐到 GCJ-02（我的图钉由用户点底图产生，本身已是 GCJ-02，不转换）
(function alignToGCJ() {
  METRO.lines.forEach(l => l.stations.forEach(s => { const p = wgs84ToGcj02(s.lon, s.lat); s.lon = p[0]; s.lat = p[1]; }));

  CUSTOM.forEach(m => { const c = wgs84ToGcj02(m.lon, m.lat); m.lon = c[0]; m.lat = c[1]; });
  BADMINTON.forEach(m => { const c = wgs84ToGcj02(m.lon, m.lat); m.lon = c[0]; m.lat = c[1]; });
})();

/* ---------- geo helpers ---------- */
function lonLatToWorld(lon, lat, z) {
  const n = TILE * Math.pow(2, z);
  const x = (lon + 180) / 360 * n;
  const latRad = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return [x, y];
}
function worldToLonLat(x, y, z) {
  const n = TILE * Math.pow(2, z);
  const lon = x / n * 360 - 180;
  const lat = Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI;
  return [lon, lat];
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  el.appendChild(pin);

  num.setAttribute('x', 0); num.setAttribute('y', -4.6);

  num.setAttribute('font-size', '11');
  num.setAttribute('font-weight', '800');
  num.setAttribute('font-family', '"QDFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif');

  el.addEventListener('mouseenter', () => { el.style.filter = 'brightness(1.15)'; });
  el.addEventListener('mouseleave', () => { el.style.filter = ''; });

}
function buildPinLayer(L) {
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('id', 'layer-' + L.id);
  overlayEl.appendChild(g);
  pinLayerEls[L.id] = g;
  pinEls[L.id] = [];
  L.data.forEach(m => {
    const el = makePinEl(L, m);
    g.appendChild(el);
    pinEls[L.id].push({ el, m });
  });
}
function rebuildPinLayer(L) {
  const old = pinLayerEls[L.id];
  if (old) old.remove();
  delete pinLayerEls[L.id];
  delete pinEls[L.id];
  buildPinLayer(L);
}
function renderPinLayers() {
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const toXY = (lon, lat) => {
    const [wx, wy] = lonLatToWorld(lon, lat, state.zoom);
    return [wx - cx + W / 2, wy - cy + H / 2];
  };
  pinLayers.forEach(L => {
    const show = layerVisible[L.id];
    (pinEls[L.id] || []).forEach(c => {
      const [sx, sy] = toXY(c.m.lon, c.m.lat);
      c.el.setAttribute('transform', 'translate(' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ')');
      c.el.style.display = show ? '' : 'none';
    });
  });
}
function showPinPopup(m, L) {
  const lines = ['<div class="p-addr">' + esc(m.addr) + '</div>'];
  if (m.remark && m.remark !== '无备注' && m.remark.trim() !== '') {
    lines.push('<div class="p-remark">' + esc(m.remark) + '</div>');
  }
  if (m.note) lines.push('<div class="p-xy-note">' + esc(m.note) + '</div>');
  lines.push('<div class="p-xy">#' + m.n + ' · ' + m.lat.toFixed(5) + ', ' + m.lon.toFixed(5) + '</div>');
  if (L.removable) {
    lines.push('<div class="p-del" id="pin-del">删除这个图钉</div>');
  }
  showPopupAt(m.lon, m.lat, '#' + m.n + ' ' + m.name, lines.join(''));
  if (L.removable) {
    const delBtn = document.getElementById('pin-del');
    if (delBtn) delBtn.addEventListener('click', ev => {
      ev.stopPropagation();
      const idx = L.data.indexOf(m);
      if (idx >= 0) L.data.splice(idx, 1);
      renumberLayer(L);
      saveMYPINS();
      rebuildPinLayer(L);
      hidePopup();
      refreshPinRows();
    });
  }
}
function renumberLayer(L) {
  L.data.forEach((m, i) => { m.n = i + 1; });

function addPinAt(e) {
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);

  addPinPos = { lat: lat, lon: lon, addr: '点击坐标 ' + lat.toFixed(5) + ', ' + lon.toFixed(5) };
  openPinModal();
}

/* ---------- tile layer (在线底图) ---------- */
function tileUrls(layer, z, x, y) {
  if (MAP_SOURCE === 'tianditu') {
    const t = ((x + y) % 8 + 8) % 8;
    return ['https://t' + t + '.tianditu.gov.cn/DataServer?T=' + layer + '&x=' + x + '&y=' + y + '&l=' + z + '&tk=' + TILE_KEY];
  }
  // 高德：style=8 标准街道图（注记含在底图内），子域 1-4 随机
  const s = ((x + y) % 4) + 1;
  return ['https://webrd0' + s + '.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x=' + x + '&y=' + y + '&z=' + z];
}
const tileEls = new Map();
let tileOk = 0, tileFail = 0, bannerShown = false;
function maybeShowBanner() {
  if (bannerShown) return;
  if (tileOk === 0 && tileFail > 3) {
    bannerShown = true;
    bannerEl.classList.add('show');
  }
}
function renderTiles() {
  // 瓦片只按整数级别加载/定位；overlay（线路/站点/图钉）用连续小数 zoom 平滑缩放
  const zr = Math.round(state.zoom);
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, zr);
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const x0 = Math.floor((cx - W / 2) / TILE), x1 = Math.floor((cx + W / 2) / TILE);
  const y0 = Math.floor((cy - H / 2) / TILE), y1 = Math.floor((cy + H / 2) / TILE);
  const needed = new Set();
  for (let tx = x0; tx <= x1; tx++) {
    for (let ty = y0; ty <= y1; ty++) {
      const key = zr + '/' + tx + '/' + ty;
      needed.add(key);
      let g = tileEls.get(key);
      if (!g) {
        g = {};
        g.wrap = document.createElement('div');
        g.wrap.className = 'tile';
        // 天地图需底图+注记两层；高德单层即可
        const layers = MAP_SOURCE === 'tianditu' ? ['vec_w', 'cva_w'] : ['base'];
        layers.forEach(layerName => {
          const img = new Image();
          img.alt = '';
          img.src = tileUrls(layerName, zr, tx, ty)[0];
          g.wrap.appendChild(img);
          const onLoad = () => {
            tileOk++;
            if (tileOk > 0 && bannerShown) { bannerEl.classList.remove('show'); }
            loadingEl.style.opacity = '0';
            setTimeout(() => { if (tileOk > 0) loadingEl.style.display = 'none'; }, 500);
          };
          img.addEventListener('load', onLoad);
          img.addEventListener('error', () => { tileFail++; maybeShowBanner(); });
        });
        tilesEl.appendChild(g.wrap);
        tileEls.set(key, g);
      }
      g.wrap.style.left = (tx * TILE - cx + W / 2) + 'px';
      g.wrap.style.top = (ty * TILE - cy + H / 2) + 'px';
    }
  }
  tileEls.forEach((g, key) => {
    if (!needed.has(key)) { g.wrap.remove(); tileEls.delete(key); }
  });
}

/* ---------- overlay ---------- */
const linePathEls = {};
const stationEls = [];
const NS = 'http://www.w3.org/2000/svg';

function buildOverlay() {
  METRO.lines.forEach(l => {
    const casing = document.createElementNS(NS, 'path');
    const color = document.createElementNS(NS, 'path');
    casing.setAttribute('fill', 'none'); casing.setAttribute('stroke', '#ffffff');
    casing.setAttribute('stroke-width', '7'); casing.setAttribute('stroke-linecap', 'round'); casing.setAttribute('stroke-linejoin', 'round');
    color.setAttribute('fill', 'none'); color.setAttribute('stroke', l.colour);
    color.setAttribute('stroke-width', '4.6'); color.setAttribute('stroke-linecap', 'round'); color.setAttribute('stroke-linejoin', 'round');
    overlayEl.appendChild(casing); overlayEl.appendChild(color);
    linePathEls[l.ref] = [casing, color];
  });
  const g = document.createElementNS(NS, 'g');
  overlayEl.appendChild(g);
  allStations.forEach((s, i) => {
    const transfer = s.lines.length > 1;
    const el = document.createElementNS(NS, 'g');
    el.setAttribute('data-i', i);
    el.classList.add('station');
    const r = document.createElementNS(NS, 'circle');
    r.setAttribute('r', transfer ? 5.2 : 3.6);
    r.setAttribute('fill', '#ffffff');
    r.setAttribute('stroke', transfer ? '#1d2733' : (METRO.lines.find(l => l.ref === s.lines[0]) || {}).colour || '#1d2733');
    r.setAttribute('stroke-width', transfer ? 2.4 : 2);
    el.appendChild(r);
    const lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('x', 8); lbl.setAttribute('y', 4);
    lbl.setAttribute('font-size', '12');
    lbl.setAttribute('font-weight', '600');
    lbl.setAttribute('font-family', '"QDFont", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif');
    lbl.setAttribute('paint-order', 'stroke');
    lbl.setAttribute('stroke', '#ffffff'); lbl.setAttribute('stroke-width', '3.4'); lbl.setAttribute('stroke-linejoin', 'round');
    lbl.setAttribute('fill', '#1d2733');
    lbl.textContent = s.n;
    el.appendChild(lbl);
    el.addEventListener('click', e => { e.stopPropagation(); showStationPopup(s, el); });
    el.addEventListener('mouseenter', () => { el.querySelector('text').style.fontWeight = '800'; });
    el.addEventListener('mouseleave', () => { el.querySelector('text').style.fontWeight = '600'; });
    g.appendChild(el);
    stationEls.push({ el, name: s.n, lines: s.lines, lat: s.lat, lon: s.lon, transfer });
  });
  pinLayers.forEach(L => buildPinLayer(L));
  // 点击放在 mapEl 上：pointerdown 的 setPointerCapture 会把 click 目标重定向到 mapEl，
  // 若监听 overlayEl（mapEl 子元素）会导致新建图钉点击无反馈；moved 保护用于忽略拖拽后的 click。
  mapEl.addEventListener('click', e => {
    const hit = e.target && e.target.closest ? e.target.closest('.station, .cmarker') : null;
    if (hit) return;
    if (moved) { moved = false; return; }
    if (addingMode) { addPinAt(e); return; }
    hidePopup();
  });
}

function renderOverlay() {
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
  const W = mapEl.clientWidth, H = mapEl.clientHeight;
  const toXY = (lon, lat) => {
    const [wx, wy] = lonLatToWorld(lon, lat, state.zoom);
    return [wx - cx + W / 2, wy - cy + H / 2];
  };
  METRO.lines.forEach(l => {
    const [casing, color] = linePathEls[l.ref];
    const show = lineVisible[l.ref];
    let d = '';
    if (show) {
      const pts = l.geom.map(p => toXY(p[1], p[0]));
      d = 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
    }
    casing.setAttribute('d', d); color.setAttribute('d', d);
    casing.style.display = show ? '' : 'none';
    color.style.display = show ? '' : 'none';
  });
  const showLabels = state.zoom >= 13.5;
  const labelGrid = {};
  const gridCell = 44;
  stationEls.forEach(s => {
    const [sx, sy] = toXY(s.lon, s.lat);
    s.el.setAttribute('transform', 'translate(' + sx.toFixed(1) + ' ' + sy.toFixed(1) + ')');
    const onLine = s.lines.some(r => lineVisible[r]);
    s.el.style.display = onLine ? '' : 'none';
    const lbl = s.el.querySelector('text');
    if (showLabels && onLine) {
      const gx = Math.round(sx / gridCell), gy = Math.round(sy / gridCell);
      if (!labelGrid[gx + ',' + gy]) {
        labelGrid[gx + ',' + gy] = true;
        lbl.style.display = '';
      } else {
        lbl.style.display = 'none';
      }
    } else {
      lbl.style.display = 'none';
    }
  });
}

  popupEl.querySelector('.p-title').textContent = title;
  popupEl.querySelector('.p-meta').innerHTML = metaHtml || '';
  popupEl.querySelector('.p-nav').addEventListener('click', e => { e.stopPropagation(); openNav(lon, lat, title); });
  popupEl.style.left = sx + 'px';
  popupEl.style.top = (sy - 10) + 'px';
  popupEl.style.display = 'block';

function hidePopup() { popupEl.style.display = 'none'; }
function showStationPopup(s) {
  const chips = s.lines.map(r => {
    const l = METRO.lines.find(x => x.ref === r);
    return '<span class="line-chip" style="background:' + l.colour + '">' + lineLabel(r).split(' · ')[0] + '</span>';
  }).join('');
  const trans = s.lines.length > 1 ? ' · 换乘站' : '';
  showPopupAt(s.lon, s.lat, s.n,
    chips + '<div>' + s.lat.toFixed(5) + ', ' + s.lon.toFixed(5) + trans + '</div>');
}
function showPoiPopup(lat, lon, name, cat) {
  showPopupAt(lon, lat, name, '<div>' + esc(cat) + ' · ' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div>');
}

/* ---------- temp search marker ---------- */
let tempMarker = null;
function placeTempMarker(lon, lat) {
  if (tempMarker) tempMarker.remove();
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('pointer-events', 'none');
  const ring = document.createElementNS(NS, 'circle');
  ring.setAttribute('r', '9'); ring.setAttribute('fill', 'rgba(26,95,180,.25)');
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('r', '5'); dot.setAttribute('fill', '#1a5fb4');
  dot.setAttribute('stroke', '#fff'); dot.setAttribute('stroke-width', '2');
  g.appendChild(ring); g.appendChild(dot);
  overlayEl.appendChild(g);
  tempMarker = { g, lon, lat };
  positionTempMarker();
}
function positionTempMarker() {
  if (!tempMarker) return;
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
  const [wx, wy] = lonLatToWorld(tempMarker.lon, tempMarker.lat, state.zoom);
  tempMarker.g.setAttribute('transform', 'translate(' + (wx - cx + mapEl.clientWidth / 2).toFixed(1) + ' ' + (wy - cy + mapEl.clientHeight / 2).toFixed(1) + ')');
}
function clearTempMarker() { if (tempMarker) { tempMarker.g.remove(); tempMarker = null; } }

/* ---------- fly to ---------- */
let flyAnim = null;
function flyTo(lon, lat, targetZoom, onDone) {
  hidePopup();
  if (flyAnim) cancelAnimationFrame(flyAnim);
  const start = { lon: state.lon, lat: state.lat, zoom: state.zoom };
  const end = { lon, lat, zoom: targetZoom };
  const t0 = performance.now(), dur = 850;
  function step(t) {
    const k = ease(Math.min(1, (t - t0) / dur));
    state.lon = start.lon + (end.lon - start.lon) * k;
    state.lat = start.lat + (end.lat - start.lat) * k;
    state.zoom = clamp(start.zoom + (end.zoom - start.zoom) * k, MIN_Z, MAX_Z);
    render();
    if (k < 1) flyAnim = requestAnimationFrame(step);
    else { flyAnim = null; onDone && onDone(); }
  }
  flyAnim = requestAnimationFrame(step);
}

/* ---------- render ---------- */
let renderQueued = false;
function render() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    const vw = mapEl.clientWidth, vh = mapEl.clientHeight;
    if (overlayEl.getAttribute('viewBox') !== '0 0 ' + vw + ' ' + vh) {
      overlayEl.setAttribute('viewBox', '0 0 ' + vw + ' ' + vh);
    }
    renderTiles();
    renderOverlay();
    renderPinLayers();
    positionTempMarker();
  });
}

/* ---------- interactions ---------- */
let dragging = false, moved = false, lastX = 0, lastY = 0, pinchD = 0, pinchZoom = state.zoom;
let pointers = {};
mapEl.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const hitStation = e.target && e.target.closest ? e.target.closest('.station, .cmarker') : null;
  if (hitStation) { dragging = false; moved = false; return; }
  dragging = true; moved = false;
  if (flyAnim) { cancelAnimationFrame(flyAnim); flyAnim = null; }
  lastX = e.clientX; lastY = e.clientY;
  mapEl.classList.add('dragging');
  mapEl.setPointerCapture && mapEl.setPointerCapture(e.pointerId);
  hidePopup();
  pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
});
mapEl.addEventListener('pointermove', e => {
  if (Object.keys(pointers).length >= 2) return;
  if (dragging && e.pointerType === 'touch' && e.isPrimary === false) return;
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  if (moved) {
    const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
    const [lon, lat] = worldToLonLat(cx - dx, cy - dy, state.zoom);
    state.lon = lon; state.lat = lat;
    lastX = e.clientX; lastY = e.clientY;
    render();
  }
});
function endDrag() {
  dragging = false;
  mapEl.classList.remove('dragging');
}
mapEl.addEventListener('pointerup', endDrag);
mapEl.addEventListener('pointercancel', endDrag);
mapEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') endDrag(); });

mapEl.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
  const [lon, lat] = worldToLonLat(mx - mapEl.clientWidth / 2 + cx, my - mapEl.clientHeight / 2 + cy, state.zoom);
  if (flyAnim) { cancelAnimationFrame(flyAnim); flyAnim = null; }
  const newZoom = clamp(state.zoom + (e.deltaY < 0 ? 0.5 : -0.5), MIN_Z, MAX_Z);
  const [nx, ny] = lonLatToWorld(lon, lat, newZoom);
  const [ncLon, ncLat] = worldToLonLat(nx - (mx - mapEl.clientWidth / 2), ny - (my - mapEl.clientHeight / 2), newZoom);
  state.zoom = newZoom; state.lon = ncLon; state.lat = ncLat;
  render();
}, { passive: false });

mapEl.addEventListener('dblclick', e => {
  e.preventDefault();
  const rect = mapEl.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
  const [lon, lat] = worldToLonLat(mx - mapEl.clientWidth / 2 + cx, my - mapEl.clientHeight / 2 + cy, state.zoom);
  zoomAt(lon, lat, state.zoom + 1);
});

function zoomAt(lon, lat, z) {
  // 平滑动画缩放到目标级别（flyTo 支持小数 zoom 连续插值，瓦片按整数级加载）
  flyTo(lon, lat, clamp(z, MIN_Z, MAX_Z));
}

document.getElementById('btn-zoom-in').addEventListener('click', () => zoomAt(state.lon, state.lat, state.zoom + 1));
document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAt(state.lon, state.lat, state.zoom - 1));
document.getElementById('btn-locate').addEventListener('click', () => {
  flyTo(QD_CENTER.lon, QD_CENTER.lat, QD_CENTER.zoom, clearTempMarker);
});

mapEl.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch' && pointers[e.pointerId]) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    const ids = Object.keys(pointers);
    if (ids.length === 2) {
      const p1 = pointers[ids[0]], p2 = pointers[ids[1]];
      const d = Math.hypot(p1.x - p2.x, p1.y - p2.y);
      if (pinchD > 0) {
        const mid = [(p1.x + p2.x) / 2, (p1.y + p2.y) / 2];
        const rect = mapEl.getBoundingClientRect();
        const mx = mid[0] - rect.left, my = mid[1] - rect.top;
        const [cx, cy] = lonLatToWorld(state.lon, state.lat, state.zoom);
        const [lon, lat] = worldToLonLat(mx - mapEl.clientWidth / 2 + cx, my - mapEl.clientHeight / 2 + cy, state.zoom);
        const newZoom = clamp(Math.round(pinchZoom + (Math.log2(d / pinchD)) * 2), MIN_Z, MAX_Z);
        zoomAt(lon, lat, newZoom);
        pinchZoom = newZoom;
      } else {
        pinchD = d; pinchZoom = state.zoom;
      }
    }
  }
});
function endPointer(e) { delete pointers[e.pointerId]; if (Object.keys(pointers).length < 2) { pinchD = 0; } }
mapEl.addEventListener('pointerup', endPointer);
mapEl.addEventListener('pointercancel', endPointer);

/* ---------- offline search (stations + POIs) ---------- */
const searchBox = document.querySelector('.search-box');
let activeIdx = -1, suggestItems = [];

function normalize(q) { return q.replace(/\s+/g, '').toLowerCase(); }

function localSearch(q) {
  const nq = normalize(q);
  return allStations.filter(s => normalize(s.n).includes(nq)).slice(0, 6);
}
function layerSearch(q) {
  const nq = normalize(q);
  const out = [];
  for (const L of pinLayers) {
    if (!L.data.length) continue;
    for (const m of L.data) {
      if (normalize(m.name).includes(nq)) {
        out.push({ layer: L, m: m });
        if (out.length >= 12) return out;
      }
    }
  }
  return out;
}
function poiSearch(q) {
  const nq = normalize(q);
  const out = [];
  for (const p of POIS) {
    if (normalize(p.n).includes(nq)) {
      out.push(p);
      if (out.length >= 6) break;
    }
  }
  return out;
}

function renderSuggest() {
  const q = searchInput.value.trim();
  if (!q) { hideSuggest(); return; }
  const local = localSearch(q);
  const pois = poiSearch(q);
  const pins = layerSearch(q);
  const html = [];
  if (local.length) {
    html.push('<div class="s-group">地铁站</div>');
    local.forEach(s => {
      const chip = '<span class="chip" style="background:' + (METRO.lines.find(l => l.ref === s.lines[0]) || {}).colour + '">' +
        s.lines.map(r => (r === '11' ? '11' : r === '13' ? '13' : r)).join('/') + '</span>';
      html.push('<div class="s-item" data-kind="station" data-name="' + escAttr(s.n) + '">' +
        '<span class="s-name">' + hl(s.n, q) + '</span>' + chip + '<span class="s-tag">地铁站</span></div>');
    });
  }
  if (pois.length) {
    html.push('<div class="s-group">地点</div>');
    pois.forEach(p => {
      html.push('<div class="s-item" data-kind="poi" data-name="' + escAttr(p.n) + '" data-cat="' + escAttr(p.c) + '" data-lat="' + p.lat + '" data-lon="' + p.lon + '">' +
        '<span class="s-name">' + hl(p.n, q) + '</span>' + '<span class="tag-pill">' + esc(p.c) + '</span></div>');
    });
  }
  if (pins.length) {
    html.push('<div class="s-group">我的标注 / 图钉</div>');
    pins.forEach(it => {
      html.push('<div class="s-item" data-kind="pin" data-layer="' + it.layer.id + '" data-idx="' + it.layer.data.indexOf(it.m) + '">' +
        '<span class="s-name">' + hl(it.m.name, q) + '</span>' + '<span class="tag-pill">' + esc(it.layer.name) + ' #' + it.m.n + '</span></div>');
    });
  }
  if (!local.length && !pois.length && !pins.length) {
    html.push('<div class="s-empty">未找到匹配的地铁站或地点</div>');
  }
  suggestEl.innerHTML = html.join('');
  suggestEl.classList.add('show');
  searchInput.setAttribute('aria-expanded', 'true');
  collectItems();
}

function hl(text, q) {
  const idx = normalize(text).indexOf(normalize(q));
  if (idx < 0) return esc(text);
  return esc(text.slice(0, idx)) + '<b>' + esc(text.slice(idx, idx + q.length)) + '</b>' + esc(text.slice(idx + q.length));
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }
function collectItems() {
  suggestItems = Array.from(suggestEl.querySelectorAll('.s-item'));
  activeIdx = -1;
}
function hideSuggest() { suggestEl.classList.remove('show'); searchInput.setAttribute('aria-expanded', 'false'); }

function chooseItem(item) {
  if (!item) return;
  const kind = item.dataset.kind;
  hideSuggest(); searchInput.value = ''; searchClear.classList.remove('show');
  if (kind === 'station') {
    const nm = item.dataset.name;
    const s = stationIndex[nm];
    if (!s) return;
    flyTo(s.lon, s.lat, 15, () => {
      showStationPopup({ n: nm, lat: s.lat, lon: s.lon, lines: s.lines });
    });
  } else if (kind === 'poi') {
    const lat = parseFloat(item.dataset.lat), lon = parseFloat(item.dataset.lon);
    const nm = item.dataset.name, cat = item.dataset.cat;
    clearTempMarker();
    flyTo(lon, lat, 14, () => {
      placeTempMarker(lon, lat);
      showPoiPopup(lat, lon, nm, cat);
    });
  } else if (kind === 'pin') {
    const lid = item.dataset.layer;
    const L = pinLayers.find(x => x.id === lid);
    if (!L) return;
    const m = L.data[parseInt(item.dataset.idx, 10)];
    if (!m) return;
    layerVisible[lid] = true;
    const prow = document.querySelector('#pin-layers .layer-row[data-layer="' + lid + '"]');
    if (prow) prow.classList.remove('off');
    renderPinLayers();
    flyTo(m.lon, m.lat, 15, () => showPinPopup(m, L));
  }
}

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.classList.toggle('show', !!q);
  renderSuggest();
});
searchClear.addEventListener('click', () => { searchInput.value = ''; searchClear.classList.remove('show'); hideSuggest(); searchInput.focus(); });
suggestEl.addEventListener('mousedown', e => {
  e.preventDefault();
  const item = e.target.closest('.s-item');
  if (item) chooseItem(item);
});
suggestEl.addEventListener('click', e => { const item = e.target.closest('.s-item'); if (item) chooseItem(item); });
searchInput.addEventListener('keydown', e => {
  if (!suggestEl.classList.contains('show')) return;
  const items = suggestItems;
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault(); activeIdx = (activeIdx + 1) % items.length; highlight(items);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault(); activeIdx = (activeIdx - 1 + items.length) % items.length; highlight(items);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const it = activeIdx >= 0 ? items[activeIdx] : items[0];
    if (it) chooseItem(it);
  } else if (e.key === 'Escape') {
    hideSuggest();
  }
});
function highlight(items) {
  items.forEach((it, i) => it.classList.toggle('active', i === activeIdx));
  const act = items[activeIdx];
  if (act) {
    const top = act.offsetTop;
    const cur = suggestEl.scrollTop;
    if (top < cur) suggestEl.scrollTop = top;
    else if (top + act.offsetHeight > cur + suggestEl.clientHeight) suggestEl.scrollTop = top - suggestEl.clientHeight + act.offsetHeight;
  }
}
document.addEventListener('click', e => {
  if (!searchBox.contains(e.target) && !suggestEl.contains(e.target)) hideSuggest();
});

/* ---------- toggle line ---------- */
function toggleLine(ref) {
  lineVisible[ref] = !lineVisible[ref];
  refreshLegend(); renderOverlay();
}

/* ---------- mobile panel ---------- */
const panelEl = document.getElementById('panel');
document.getElementById('panel-toggle').addEventListener('click', () => panelEl.classList.toggle('open'));
document.getElementById('btn-locate').addEventListener('click', () => panelEl.classList.remove('open'));

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
}

/* ---------- resize ---------- */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { render(); }, 120);
});

/* ---------- init ---------- */
buildOverlay();
function initRender() {
  if (mapEl.clientWidth > 0) { render(); }
  else { requestAnimationFrame(initRender); }
}
initRender();
window.addEventListener('resize', () => render());
setTimeout(() => {
  render();
  if (!tileEls.size) loadingEl.style.display = 'none';
}, 6000);
</script>
</body>
